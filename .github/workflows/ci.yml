on:
  - push
  - pull_request

jobs:
  codeQuality:
    name: "Tests & Code Quality"
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        otpElixir: [{ otp: "27.2", elixir: "1.17.3" }]
    steps:
      - name: repo checkout
        uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otpElixir.otp }}
          elixir-version: ${{ matrix.otpElixir.elixir }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{matrix.otpElixir.otp}}-${{matrix.otpElixir.elixir}}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{matrix.otpElixir.otp}}-${{matrix.otpElixir.elixir}}-mix-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get
      - run: mix credo --strict
        continue-on-error: true
      - run: mix format --check-formatted
        continue-on-error: true
      - run: mix dialyzer
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mongodb: ["5.0", "6.0", "7.0"]
        otpElixir:
          [
            { otp: "25.3", elixir: "1.15.8" },
            { otp: "26.2", elixir: "1.16.3" },
            { otp: "27.2", elixir: "1.17.3" },
          ]
        topology: [replica_set, server]
    steps:
      - name: repo checkout
        uses: actions/checkout@v4
      - id: start-mongodb
        name: start mongodb
        uses: mongodb-labs/drivers-evergreen-tools@master
        with:
          version: "${{matrix.mongodb}}"
          topology: "${{matrix.topology}}"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otpElixir.otp }}
          elixir-version: ${{ matrix.otpElixir.elixir }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{matrix.otpElixir.otp}}-${{matrix.otpElixir.elixir}}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{matrix.otpElixir.otp}}-${{matrix.otpElixir.elixir}}-mix-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get
      - run: mix test
        env:
          MONGODB_URI: ${{ steps.start-mongodb.outputs.cluster-uri }}
